<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>STAR CORRIDOR</title>
<style>
  :root{
    --bg:#050505;
    --panel:#0a0a0a;
    --line:#d8d8d8;
    --dim:#888;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:#020202;
    color:#eee;
    overflow:hidden;
    font-family:"Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    touch-action:none;
  }
  body{
    display:grid;
    place-items:center;
  }
  .shell{
    position:relative;
    width:min(100vw, 430px);
    height:min(100vh, 860px);
    padding:10px;
    filter:contrast(1.05);
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    border:2px solid #d9d9d9;
    border-radius:54px;
    background:#050505;
    box-shadow:
      inset 0 0 18px rgba(255,255,255,.08),
      0 0 24px rgba(255,255,255,.09);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  .screen::before{
    content:"";
    pointer-events:none;
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        rgba(0,0,0,.06) 2px,
        rgba(0,0,0,.06) 4px
      );
    mix-blend-mode:screen;
    opacity:.72;
    z-index:4;
  }
  .screen::after{
    content:"";
    pointer-events:none;
    position:absolute;
    inset:-2%;
    background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.35) 100%);
    z-index:5;
  }
  .hint{
    position:absolute;
    width:100%;
    bottom:2px;
    left:0;
    text-align:center;
    font-size:10px;
    opacity:.25;
    letter-spacing:.08em;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="screen">
    <canvas id="game" width="390" height="780" aria-label="STAR CORRIDOR"></canvas>
  </div>
  <div class="hint">DRAG / ← → · SPACE BOOST · ESC PAUSE</div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha:false });

const W = canvas.width, H = canvas.height;
const DPR = 1;
ctx.imageSmoothingEnabled = false;

const SAVE_KEY = "star-corridor-save-v1";
const defaults = {
  hi: 0,
  credits: 0,
  upgrades: { shield:0, fire:0, boost:0, engine:0, weapon:0 },
  sfx: true,
  music: true
};
let save = loadSave();

function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(!s) return structuredClone(defaults);
    return {
      ...structuredClone(defaults),
      ...s,
      upgrades:{...defaults.upgrades, ...(s.upgrades||{})}
    };
  }catch(e){ return structuredClone(defaults); }
}
function writeSave(){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }

const state = {
  screen:"menu",
  menuIndex:0,
  upgradeIndex:0,
  settingsIndex:0,
  paused:false,
  time:0,
  gameTime:0,
  score:0,
  sector:1,
  fuel:100,
  boost:100,
  combo:1,
  shake:0,
  flash:0,
  speed:1,
  player:null,
  bullets:[],
  asteroids:[],
  enemies:[],
  enemyBullets:[],
  particles:[],
  stars:[],
  spawnTimer:0,
  enemyTimer:0,
  touchActive:false,
  pointerX:W/2,
  last:performance.now()
};

for(let i=0;i<80;i++){
  state.stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    s:Math.random()<.85?1:2,
    v:.25+Math.random()*1.1,
    a:.25+Math.random()*.7
  });
}

const key = {};
addEventListener("keydown", e => {
  key[e.code]=true;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  handleKeyPress(e.code);
});
addEventListener("keyup", e => key[e.code]=false);

canvas.addEventListener("pointerdown", e=>{
  state.touchActive=true;
  const p=pointerPos(e); state.pointerX=p.x;
  if(state.screen==="game" && !state.paused) blip(560,.035,.03);
  else handlePointerMenu(p.x,p.y);
});
canvas.addEventListener("pointermove", e=>{
  if(!state.touchActive) return;
  const p=pointerPos(e); state.pointerX=p.x;
});
addEventListener("pointerup", ()=> state.touchActive=false);

function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};
}

function handlePointerMenu(x,y){
  if(state.screen==="menu"){
    const rows=[405,455,505,555];
    let idx=rows.findIndex(v=>Math.abs(y-v)<24);
    if(idx>=0){ state.menuIndex=idx; selectMenu(); }
  }else if(state.screen==="gameover"){
    if(y>510 && y<570) startGame();
    else if(y>=570 && y<625){ state.screen="menu"; blip(300,.05,.04); }
  }else if(state.screen==="upgrades"){
    const ys=[280,360,440,520,600];
    let idx=ys.findIndex(v=>Math.abs(y-v)<28);
    if(idx>=0){ state.upgradeIndex=idx; buyUpgrade(); }
    else if(y>680){ state.screen="menu"; blip(300,.05,.04); }
  }else if(state.screen==="settings"){
    if(y>330&&y<390){ save.sfx=!save.sfx; writeSave(); blip(600,.05,.04); }
    else if(y>400&&y<460){ save.music=!save.music; writeSave(); blip(600,.05,.04); }
    else if(y>650){ state.screen="menu"; }
  }else if(state.screen==="highscore"){
    state.screen="menu";
  }
}

function handleKeyPress(code){
  if(state.screen==="game"){
    if(code==="Escape" || code==="KeyP"){
      state.paused=!state.paused; blip(state.paused?220:440,.06,.05);
    }
    return;
  }

  if(code==="ArrowUp" || code==="KeyW"){
    if(state.screen==="menu"){ state.menuIndex=(state.menuIndex+3)%4; blip(360,.035,.03); }
    else if(state.screen==="upgrades"){ state.upgradeIndex=(state.upgradeIndex+4)%5; blip(360,.035,.03); }
    else if(state.screen==="settings"){ state.settingsIndex=(state.settingsIndex+1)%2; blip(360,.035,.03); }
  }
  if(code==="ArrowDown" || code==="KeyS"){
    if(state.screen==="menu"){ state.menuIndex=(state.menuIndex+1)%4; blip(420,.035,.03); }
    else if(state.screen==="upgrades"){ state.upgradeIndex=(state.upgradeIndex+1)%5; blip(420,.035,.03); }
    else if(state.screen==="settings"){ state.settingsIndex=(state.settingsIndex+1)%2; blip(420,.035,.03); }
  }
  if(code==="Enter" || code==="Space"){
    if(state.screen==="menu") selectMenu();
    else if(state.screen==="gameover") startGame();
    else if(state.screen==="upgrades") buyUpgrade();
    else if(state.screen==="settings"){
      if(state.settingsIndex===0) save.sfx=!save.sfx;
      else save.music=!save.music;
      writeSave(); blip(600,.05,.04);
    }else if(state.screen==="highscore") state.screen="menu";
  }
  if(code==="Escape"){
    if(["upgrades","settings","highscore","gameover"].includes(state.screen)){
      state.screen="menu"; blip(260,.05,.04);
    }
  }
}

function selectMenu(){
  blip(700,.07,.05);
  if(state.menuIndex===0) startGame();
  if(state.menuIndex===1) state.screen="upgrades";
  if(state.menuIndex===2) state.screen="highscore";
  if(state.menuIndex===3) state.screen="settings";
}

const upgradeDefs = [
  {k:"shield", n:"SHIELD", base:50},
  {k:"fire", n:"FIRE RATE", base:75},
  {k:"boost", n:"BOOST", base:60},
  {k:"engine", n:"ENGINE", base:90},
  {k:"weapon", n:"WEAPON", base:120}
];

function buyUpgrade(){
  const d=upgradeDefs[state.upgradeIndex];
  const lvl=save.upgrades[d.k];
  if(lvl>=5){ fail(); return; }
  const cost=Math.floor(d.base*(1+lvl*.75));
  if(save.credits<cost){ fail(); return; }
  save.credits-=cost;
  save.upgrades[d.k]++;
  writeSave();
  powerup();
}

function startGame(){
  state.screen="game";
  state.paused=false;
  state.gameTime=0;
  state.score=0;
  state.sector=1;
  state.speed=1;
  state.combo=1;
  state.spawnTimer=0;
  state.enemyTimer=0;
  state.bullets.length=0;
  state.asteroids.length=0;
  state.enemies.length=0;
  state.enemyBullets.length=0;
  state.particles.length=0;
  state.fuel=100;
  state.boost=100 + save.upgrades.boost*12;
  state.player={
    x:W/2,y:H-125,
    w:18,h:28,
    hp:3+save.upgrades.shield,
    maxHp:3+save.upgrades.shield,
    inv:0,
    fireCd:0
  };
  state.flash=.25;
  startTone();
}

function endGame(){
  boom(state.player.x,state.player.y, 44, true);
  state.shake=18;
  state.flash=.6;
  state.screen="gameover";
  const earned=Math.floor(state.score/120);
  save.credits += earned;
  save.hi=Math.max(save.hi, Math.floor(state.score));
  writeSave();
  gameOverTone();
}

function update(dt){
  state.time += dt;
  if(state.flash>0) state.flash-=dt;
  if(state.shake>0) state.shake=Math.max(0,state.shake-dt*28);

  // ambient stars always drift
  for(const s of state.stars){
    s.y += s.v*(state.screen==="game"?1.4+state.speed*.5:.35);
    if(s.y>H){ s.y=-2; s.x=Math.random()*W; }
  }

  if(state.screen!=="game" || state.paused) return;

  state.gameTime += dt;
  state.speed = Math.min(5.2, 1 + state.gameTime/28);
  state.sector = 1 + Math.floor(state.gameTime/20);
  state.score += dt*(8+state.speed*5)*state.combo;

  const p=state.player;
  if(p.inv>0)p.inv-=dt;
  p.fireCd-=dt;

  const engineMul = 1 + save.upgrades.engine*.1;
  let move=0;
  if(key.ArrowLeft||key.KeyA) move-=1;
  if(key.ArrowRight||key.KeyD) move+=1;
  p.x += move*180*engineMul*dt;
  if(state.touchActive){
    const target=Math.max(28,Math.min(W-28,state.pointerX));
    p.x += (target-p.x)*Math.min(1,dt*12*engineMul);
  }
  p.x=Math.max(26,Math.min(W-26,p.x));

  // boost
  const boosting=(key.Space||key.ShiftLeft||key.ShiftRight) && state.boost>0;
  if(boosting){
    state.boost=Math.max(0,state.boost-dt*34);
    state.score+=dt*28;
    if(Math.random()<.35) exhaustParticle(p.x,p.y+17,true);
  }else{
    const maxB=100+save.upgrades.boost*12;
    state.boost=Math.min(maxB,state.boost+dt*7);
  }

  // autofire
  const fireRate = Math.max(.12, .34-save.upgrades.fire*.038);
  if(p.fireCd<=0){
    shoot();
    p.fireCd=fireRate;
  }

  state.spawnTimer-=dt;
  if(state.spawnTimer<=0){
    spawnAsteroid();
    state.spawnTimer=Math.max(.16,.68-state.speed*.075)*(0.7+Math.random()*.7);
  }

  state.enemyTimer-=dt;
  if(state.enemyTimer<=0 && state.gameTime>5){
    spawnEnemy();
    state.enemyTimer=Math.max(1.4,4.8-state.speed*.45)*(0.8+Math.random()*.7);
  }

  // bullets
  for(let i=state.bullets.length-1;i>=0;i--){
    const b=state.bullets[i];
    b.y-=b.v*dt;
    if(b.y<-10){state.bullets.splice(i,1); continue;}
  }

  // enemies
  for(let i=state.enemies.length-1;i>=0;i--){
    const e=state.enemies[i];
    e.y += e.v*dt;
    e.phase += dt;
    e.x += Math.sin(e.phase*2.7)*18*dt;
    e.fire-=dt;
    if(e.fire<=0){
      state.enemyBullets.push({x:e.x,y:e.y+8,v:120+state.speed*18});
      e.fire=1.4+Math.random()*1.3;
      enemyShootTone();
    }
    if(e.y>H+30){state.enemies.splice(i,1); continue;}
    if(hitRect(p,e) && p.inv<=0){
      damagePlayer(e.x,e.y); state.enemies.splice(i,1); continue;
    }
  }

  for(let i=state.enemyBullets.length-1;i>=0;i--){
    const b=state.enemyBullets[i];
    b.y+=b.v*dt;
    if(b.y>H+10){state.enemyBullets.splice(i,1);continue;}
    if(pointInPlayer(b.x,b.y,p) && p.inv<=0){
      damagePlayer(b.x,b.y); state.enemyBullets.splice(i,1);
    }
  }

  // asteroids
  for(let i=state.asteroids.length-1;i>=0;i--){
    const a=state.asteroids[i];
    a.y += a.v*dt;
    a.rot += a.rv*dt;
    if(a.y>H+40){state.asteroids.splice(i,1); continue;}
    if(circleRect(a,p) && p.inv<=0){
      damagePlayer(a.x,a.y); state.asteroids.splice(i,1); continue;
    }
  }

  // player bullets collisions
  for(let bi=state.bullets.length-1;bi>=0;bi--){
    const b=state.bullets[bi]; let consumed=false;
    for(let ai=state.asteroids.length-1;ai>=0;ai--){
      const a=state.asteroids[ai];
      if(dist2(b.x,b.y,a.x,a.y)<(a.r+4)*(a.r+4)){
        a.hp -= 1 + save.upgrades.weapon*.35;
        state.bullets.splice(bi,1); consumed=true;
        spark(a.x,a.y);
        if(a.hp<=0){
          boom(a.x,a.y, a.r*1.3, false);
          state.score += 25*a.r/10*state.combo;
          state.combo=Math.min(5,state.combo+.08);
          state.asteroids.splice(ai,1);
        }
        break;
      }
    }
    if(consumed) continue;
    for(let ei=state.enemies.length-1;ei>=0;ei--){
      const e=state.enemies[ei];
      if(Math.abs(b.x-e.x)<12 && Math.abs(b.y-e.y)<12){
        e.hp -= 1 + save.upgrades.weapon*.4;
        state.bullets.splice(bi,1); consumed=true;
        spark(e.x,e.y);
        if(e.hp<=0){
          boom(e.x,e.y,20,false);
          state.score += 90*state.combo;
          state.combo=Math.min(5,state.combo+.15);
          state.enemies.splice(ei,1);
        }
        break;
      }
    }
  }

  for(let i=state.particles.length-1;i>=0;i--){
    const q=state.particles[i];
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.life-=dt;
    if(q.life<=0)state.particles.splice(i,1);
  }

  if(Math.random()<.18) exhaustParticle(p.x+(Math.random()-.5)*5,p.y+18,false);
}

function shoot(){
  const p=state.player;
  const spread=save.upgrades.weapon>=4;
  state.bullets.push({x:p.x,y:p.y-18,v:350});
  if(spread){
    state.bullets.push({x:p.x-7,y:p.y-12,v:335});
    state.bullets.push({x:p.x+7,y:p.y-12,v:335});
  }
  laserTone();
}

function spawnAsteroid(){
  const r=6+Math.random()*13;
  state.asteroids.push({
    x:18+Math.random()*(W-36),
    y:-30,
    r,
    v:70+state.speed*30+Math.random()*50,
    rot:Math.random()*6.28,
    rv:(Math.random()-.5)*1.8,
    hp:Math.max(1,Math.round(r/9))
  });
}

function spawnEnemy(){
  state.enemies.push({
    x:36+Math.random()*(W-72),
    y:-25,
    v:62+state.speed*18,
    hp:2+Math.floor(state.sector/3),
    fire:.8+Math.random()*1.2,
    phase:Math.random()*6.28,
    w:20,h:18
  });
}

function damagePlayer(x,y){
  const p=state.player;
  p.hp--;
  p.inv=1.0;
  state.combo=1;
  state.shake=9;
  state.flash=.16;
  boom(x,y,18,false);
  hitTone();
  if(p.hp<=0) setTimeout(endGame,60);
}

function dist2(x1,y1,x2,y2){const dx=x1-x2,dy=y1-y2;return dx*dx+dy*dy}
function hitRect(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2}
function pointInPlayer(x,y,p){return Math.abs(x-p.x)<p.w/2 && Math.abs(y-p.y)<p.h/2}
function circleRect(a,p){
  const dx=Math.abs(a.x-p.x), dy=Math.abs(a.y-p.y);
  if(dx>p.w/2+a.r || dy>p.h/2+a.r)return false;
  if(dx<=p.w/2 || dy<=p.h/2)return true;
  const qx=dx-p.w/2,qy=dy-p.h/2;
  return qx*qx+qy*qy<=a.r*a.r;
}

const boomColors=["#ff3b00","#ff7200","#ffb000","#ffe45c","#ffffff","#00d9ff"];
function boom(x,y,size,major){
  const n=Math.floor((major?40:18)+size*.6);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(major?70:35)+Math.random()*(major?130:95);
    state.particles.push({
      x,y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      g:8,
      life:.18+Math.random()*.55,
      max:.73,
      s:2+Math.floor(Math.random()*4),
      c:boomColors[Math.floor(Math.random()*boomColors.length)]
    });
  }
  explosionTone(major);
}
function spark(x,y){
  for(let i=0;i<5;i++){
    state.particles.push({x,y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,g:0,life:.18,max:.18,s:2,c:"#ffffff"});
  }
}
function exhaustParticle(x,y,hot){
  state.particles.push({
    x,y,vx:(Math.random()-.5)*14,vy:45+Math.random()*45,g:0,
    life:.15+Math.random()*.2,max:.35,s:hot?2:1,c:hot?"#00d9ff":"#bcbcbc"
  });
}

function draw(){
  ctx.save();
  if(state.shake>0){
    ctx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);
  }
  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,W,H);

  drawStars();

  switch(state.screen){
    case "menu": drawMenu(); break;
    case "game": drawGame(); break;
    case "gameover": drawGameOver(); break;
    case "upgrades": drawUpgrades(); break;
    case "settings": drawSettings(); break;
    case "highscore": drawHighScore(); break;
  }

  if(state.flash>0){
    ctx.globalAlpha=Math.min(.5,state.flash*1.5);
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  // subtle inner CRT border
  ctx.strokeStyle="rgba(255,255,255,.42)";
  ctx.lineWidth=1;
  roundRect(ctx,4,4,W-8,H-8,42);
  ctx.stroke();

  ctx.restore();
}

function drawStars(){
  for(const s of state.stars){
    ctx.globalAlpha=s.a;
    ctx.fillStyle="#ddd";
    ctx.fillRect(Math.round(s.x),Math.round(s.y),s.s,s.s);
  }
  ctx.globalAlpha=1;
}

function drawMenu(){
  centerText("STAR",56,32, "#f0f0f0");
  centerText("CORRIDOR",95,32, "#f0f0f0");
  centerText("ARCADE MODE",138,14, "#aaa");

  drawShip(W/2,255,1.25,false);
  // minimal moving asteroids
  drawAsteroid(72,220,11,state.time*.3);
  drawAsteroid(325,185,7,state.time*.5);
  drawAsteroid(300,305,12,state.time*.2);

  const items=["START","UPGRADES","HIGH SCORE","SETTINGS"];
  for(let i=0;i<items.length;i++){
    const y=405+i*50;
    if(i===state.menuIndex){
      ctx.strokeStyle="#eee"; ctx.lineWidth=1;
      ctx.strokeRect(93,y-26,204,34);
      text("> "+items[i]+" <", W/2, y, 18, "#fff","center");
    }else{
      text(items[i],W/2,y,18,"#aaa","center");
    }
  }
  centerText("PRESS START",680,13,"#888");
  text("SFX "+(save.sfx?"ON":"OFF"),W-36,722,11,"#777","right");
}

function drawGame(){
  // top HUD
  text("SCORE",24,26,10,"#aaa");
  text(String(Math.floor(state.score)).padStart(7,"0"),24,44,18,"#eee");
  text("HI-SCORE",W-24,26,10,"#aaa","right");
  text(String(save.hi).padStart(7,"0"),W-24,44,18,"#eee","right");
  line(16,62,W-16,62,"#aaa");

  for(const a of state.asteroids) drawAsteroid(a.x,a.y,a.r,a.rot);
  for(const e of state.enemies) drawEnemy(e.x,e.y);
  for(const b of state.enemyBullets){
    ctx.fillStyle="#bbb";ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-2,3,5);
  }
  for(const b of state.bullets){
    ctx.fillStyle="#fff";ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-6,3,10);
  }
  for(const p of state.particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.c;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  }
  ctx.globalAlpha=1;

  const p=state.player;
  if(p && (p.inv<=0 || Math.floor(p.inv*12)%2===0)) drawShip(p.x,p.y,1,false);

  // bottom HUD
  line(16,H-86,W-16,H-86,"#aaa");
  text("SHIELD",24,H-63,10,"#aaa");
  for(let i=0;i<p.maxHp;i++){
    ctx.strokeStyle="#aaa";ctx.strokeRect(24+i*18,H-48,13,10);
    if(i<p.hp){ctx.fillStyle="#ddd";ctx.fillRect(26+i*18,H-46,9,6);}
  }
  text("SECTOR",W/2,H-63,10,"#aaa","center");
  text(String(state.sector).padStart(2,"0"),W/2,H-42,16,"#eee","center");
  text("BOOST",W-24,H-63,10,"#aaa","right");
  const maxB=100+save.upgrades.boost*12;
  const bw=82;
  ctx.strokeStyle="#aaa";ctx.strokeRect(W-24-bw,H-49,bw,12);
  ctx.fillStyle="#ddd";ctx.fillRect(W-22-bw,H-47,(bw-4)*(state.boost/maxB),8);
  if(state.combo>1.1) text("x"+state.combo.toFixed(1),W-24,H-98,10,"#bbb","right");

  if(state.paused){
    ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,W,H);
    centerText("PAUSED",H/2-12,28,"#eee");
    centerText("ESC / P TO RESUME",H/2+26,11,"#888");
  }
}

function drawGameOver(){
  centerText("GAME OVER",110,31,"#eee");
  centerText("SCORE",250,11,"#888");
  centerText(String(Math.floor(state.score)).padStart(7,"0"),280,20,"#eee");
  centerText("SECTOR "+state.sector,320,12,"#aaa");
  centerText("BEST "+String(save.hi).padStart(7,"0"),355,12,"#aaa");
  centerText("+ "+Math.floor(state.score/120)+" CREDITS",395,11,"#777");

  text("> RETRY <",W/2,535,19,"#eee","center");
  text("MENU",W/2,585,17,"#888","center");

  // residual colored blast
  const cx=W/2, cy=185;
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2 + Math.sin(i*2.13)*.25;
    const r=12+(i%7)*3;
    ctx.fillStyle=boomColors[i%boomColors.length];
    ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),3+(i%3),3+(i%3));
  }
}

function drawUpgrades(){
  centerText("UPGRADES",72,30,"#eee");
  line(20,96,W-20,96,"#aaa");
  centerText("CREDITS "+String(save.credits).padStart(5,"0"),128,13,"#aaa");

  const ys=[280,360,440,520,600];
  for(let i=0;i<upgradeDefs.length;i++){
    const d=upgradeDefs[i], y=ys[i], lvl=save.upgrades[d.k];
    if(i===state.upgradeIndex){
      ctx.strokeStyle="#ddd";ctx.strokeRect(20,y-38,W-40,58);
    }
    text(d.n,62,y-8,13,i===state.upgradeIndex?"#eee":"#aaa");
    for(let j=0;j<5;j++){
      ctx.strokeStyle="#888";ctx.strokeRect(190+j*23,y-20,16,16);
      if(j<lvl){ctx.fillStyle="#ddd";ctx.fillRect(193+j*23,y-17,10,10);}
    }
    const cost=lvl>=5?"MAX":Math.floor(d.base*(1+lvl*.75));
    text(String(cost),W-42,y-7,12,"#aaa","right");
  }
  centerText("ENTER / TAP TO BUY",660,11,"#777");
  centerText("ESC / BOTTOM TO BACK",704,11,"#777");
}

function drawSettings(){
  centerText("SETTINGS",92,30,"#eee");
  line(24,118,W-24,118,"#aaa");
  const rows=[
    ["SFX", save.sfx?"ON":"OFF"],
    ["MUSIC", save.music?"ON":"OFF"]
  ];
  for(let i=0;i<rows.length;i++){
    const y=350+i*70;
    if(state.settingsIndex===i){
      ctx.strokeStyle="#ddd";ctx.strokeRect(72,y-32,W-144,46);
    }
    text(rows[i][0],110,y,16,"#aaa");
    text(rows[i][1],W-110,y,16,"#eee","right");
  }
  centerText("MUSIC IS SYNTHETIC AMBIENT HUM",560,10,"#666");
  centerText("ESC TO BACK",690,11,"#777");
}

function drawHighScore(){
  centerText("HIGH SCORE",100,30,"#eee");
  centerText(String(save.hi).padStart(7,"0"),220,42,"#eee");
  centerText("CREDITS",320,12,"#777");
  centerText(String(save.credits).padStart(5,"0"),350,20,"#aaa");
  centerText("PRESS ENTER / TAP",680,11,"#777");
}

function drawShip(x,y,s,ghost){
  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));
  ctx.scale(s,s);
  ctx.strokeStyle=ghost?"#666":"#ddd";
  ctx.fillStyle=ghost?"#666":"#ddd";
  ctx.lineWidth=1;

  // pixel-like silhouette
  const pts=[
    [0,-15],[5,-7],[5,-2],[12,2],[12,8],[5,6],[3,14],
    [0,10],[-3,14],[-5,6],[-12,8],[-12,2],[-5,-2],[-5,-7]
  ];
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.stroke();
  ctx.fillRect(-2,-9,4,8);
  ctx.fillRect(-1,2,2,7);

  // engine pixels
  ctx.globalAlpha=.8;
  ctx.fillRect(-5,14,2,5);ctx.fillRect(3,14,2,5);
  ctx.globalAlpha=.45;
  ctx.fillRect(-4,20,1,5);ctx.fillRect(4,20,1,5);
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawEnemy(x,y){
  ctx.save();ctx.translate(Math.round(x),Math.round(y));
  ctx.strokeStyle="#cfcfcf";ctx.lineWidth=1;
  ctx.strokeRect(-7,-7,14,14);
  ctx.beginPath();ctx.moveTo(-12,-5);ctx.lineTo(-7,0);ctx.lineTo(-12,5);
  ctx.moveTo(12,-5);ctx.lineTo(7,0);ctx.lineTo(12,5);ctx.stroke();
  ctx.fillStyle="#ddd";ctx.fillRect(-2,-2,4,4);
  ctx.restore();
}

function drawAsteroid(x,y,r,rot){
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(rot);
  ctx.strokeStyle="#9f9f9f";ctx.lineWidth=1;
  ctx.beginPath();
  const n=8;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const rr=r*(.78+((i*37)%5)*.05);
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.stroke();
  if(r>8){
    ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(-r*.25,-r*.12,r*.18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(r*.3,r*.2,r*.12,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}

function text(str,x,y,size,color="#ddd",align="left"){
  ctx.font=`${size}px "Courier New", monospace`;
  ctx.textAlign=align;
  ctx.textBaseline="alphabetic";
  ctx.fillStyle=color;
  ctx.fillText(str,x,y);
}
function centerText(str,y,size,color="#ddd"){text(str,W/2,y,size,color,"center")}
function line(x1,y1,x2,y2,color="#aaa"){
  ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

// ---------- AUDIO ----------
let audio=null, master=null, humOsc=null, humGain=null;
function ensureAudio(){
  if(audio) return;
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain(); master.gain.value=.20; master.connect(audio.destination);
  if(save.music) startHum();
}
function startHum(){
  if(!audio || humOsc) return;
  humOsc=audio.createOscillator();
  humGain=audio.createGain();
  humOsc.type="square";
  humOsc.frequency.value=55;
  humGain.gain.value=.009;
  humOsc.connect(humGain).connect(master);
  humOsc.start();
}
function syncHum(){
  if(!audio)return;
  if(save.music && !humOsc)startHum();
  if(!save.music && humOsc){humOsc.stop();humOsc=null;humGain=null;}
}
function tone(freq,dur=.06,vol=.04,type="square",slide=0){
  if(!save.sfx)return;
  ensureAudio();
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audio.currentTime+dur);
  g.gain.setValueAtTime(vol,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);
  o.connect(g).connect(master);o.start();o.stop(audio.currentTime+dur);
}
function noise(dur=.12,vol=.05){
  if(!save.sfx)return;
  ensureAudio();
  const len=Math.floor(audio.sampleRate*dur);
  const buf=audio.createBuffer(1,len,audio.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=audio.createBufferSource(), g=audio.createGain();
  s.buffer=buf;g.gain.value=vol;s.connect(g).connect(master);s.start();
}
function blip(f=440,d=.05,v=.04){tone(f,d,v,"square",-60)}
function laserTone(){ tone(920,.035,.018,"square",-420); }
function enemyShootTone(){ tone(240,.04,.014,"square",110); }
function hitTone(){ noise(.12,.055); tone(120,.12,.04,"sawtooth",-55); }
function explosionTone(major){
  noise(major?.45:.18,major?.09:.05);
  tone(major?85:120,major?.36:.15,major?.05:.03,"square",-45);
}
function powerup(){ tone(420,.08,.04,"square",220); setTimeout(()=>tone(650,.1,.04,"square",220),70); }
function fail(){ tone(130,.1,.03,"square",-45); }
function startTone(){ tone(240,.07,.03); setTimeout(()=>tone(480,.09,.04),80); }
function gameOverTone(){ tone(220,.12,.04,"square",-80); setTimeout(()=>tone(120,.25,.05,"square",-60),130); }

// resume audio on any gesture
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,()=>{
  ensureAudio(); if(audio.state==="suspended")audio.resume(); syncHum();
},{passive:true}));

function loop(t){
  const dt=Math.min(.033,(t-state.last)/1000||0);
  state.last=t;
  syncHum();
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
