<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ASTRO BLAST — 1980s Arcade</title>
<style>
:root{
  --black:#030303;
  --cab:#101010;
  --cab2:#191919;
  --white:#f2f2f2;
  --gray:#a7a7a7;
  --dim:#646464;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:var(--white);
  font-family:"Courier New",ui-monospace,monospace;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}
body{
  display:grid;
  place-items:center;
}
.arcade{
  width:min(96vw,620px);
  height:min(98vh,900px);
  padding:10px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:9px;
  background:
    linear-gradient(90deg,#080808 0 4%,#171717 4% 8%,#0b0b0b 8% 92%,#171717 92% 96%,#080808 96%);
  border:2px solid #5f5f5f;
  border-radius:18px;
  box-shadow:0 0 0 4px #0b0b0b,0 16px 45px rgba(0,0,0,.75);
}
.marquee{
  min-height:70px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:6px 14px;
  border:3px solid #8d8d8d;
  background:#030303;
  box-shadow:inset 0 0 0 3px #151515;
}
.wings{
  color:#cfcfcf;
  font-size:18px;
  letter-spacing:-2px;
  opacity:.9;
}
.wings.right{text-align:right}
.logo{
  margin:0 12px;
  text-align:center;
  font-weight:900;
  font-size:clamp(25px,6vw,43px);
  letter-spacing:2px;
  line-height:.9;
  text-shadow:3px 0 #777;
}
.coin{
  font-size:10px;
  color:#bfbfbf;
  text-align:right;
  line-height:1.15;
  margin-left:8px;
}
.bezel{
  min-height:0;
  position:relative;
  padding:18px 18px 22px;
  background:#090909;
  border:4px solid #222;
  border-radius:44px 44px 36px 36px;
  box-shadow:
    inset 0 0 0 4px #050505,
    inset 0 0 28px #000;
}
.screen{
  position:relative;
  width:100%;
  height:100%;
  max-height:620px;
  aspect-ratio:1.08/1;
  margin:auto;
  overflow:hidden;
  border-radius:16% / 12%;
  background:#020202;
  border:3px solid #373737;
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.04),
    inset 0 0 60px rgba(0,0,0,.9),
    0 0 0 6px #030303;
}
canvas{
  width:100%;
  height:100%;
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.screen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.035) 0,
      rgba(255,255,255,.035) 1px,
      rgba(0,0,0,.08) 2px,
      rgba(0,0,0,.08) 4px
    );
  opacity:.78;
  mix-blend-mode:screen;
}
.screen::after{
  content:"";
  position:absolute;
  inset:-5%;
  pointer-events:none;
  z-index:4;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.52) 100%);
}
.controls{
  position:relative;
  padding:12px 14px 16px;
  background:#090909;
  border:3px solid #7a7a7a;
  clip-path:polygon(3% 0,97% 0,100% 22%,98% 100%,2% 100%,0 22%);
  box-shadow:inset 0 0 0 4px #171717;
}
.control-row{
  display:grid;
  grid-template-columns:1.05fr 1.05fr 1.15fr .9fr .9fr;
  gap:10px;
  align-items:end;
}
.ctrl-wrap{
  display:grid;
  gap:5px;
  justify-items:center;
}
.ctrl-label{
  font-size:11px;
  letter-spacing:1px;
  color:#d0d0d0;
  min-height:13px;
}
.ctrl{
  appearance:none;
  -webkit-appearance:none;
  border:3px solid #cfcfcf;
  background:#121212;
  color:white;
  width:100%;
  min-height:58px;
  border-radius:8px;
  font:700 25px "Courier New",monospace;
  box-shadow:
    inset 0 -7px 0 #050505,
    inset 0 4px 0 #444,
    0 5px 0 #050505;
  touch-action:none;
}
.ctrl.round{
  width:58px;
  border-radius:50%;
  min-height:58px;
  background:radial-gradient(circle at 45% 32%,#f4f4f4 0 42%,#9d9d9d 43% 58%,#181818 59%);
  color:#111;
  box-shadow:0 5px 0 #050505,0 0 0 3px #333;
}
.ctrl:active,.ctrl.active{
  transform:translateY(4px);
  box-shadow:inset 0 -3px 0 #050505,inset 0 3px 0 #333,0 1px 0 #050505;
}
.slogan{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:18px;
  color:#777;
  font-size:10px;
  letter-spacing:2px;
}
@media (max-height:720px){
  .arcade{height:100vh;width:min(94vw,520px);padding:6px;gap:5px}
  .marquee{min-height:54px}
  .bezel{padding:10px}
  .controls{padding:8px 10px 10px}
  .ctrl{min-height:48px}
  .ctrl.round{width:48px;min-height:48px}
  .slogan{display:none}
}
</style>
</head>
<body>
<main class="arcade">
  <header class="marquee">
    <div class="wings">━━≡</div>
    <div class="logo">ASTRO BLAST</div>
    <div class="coin">INSERT COIN<br>TO PLAY</div>
  </header>

  <section class="bezel">
    <div class="screen">
      <canvas id="game" width="648" height="600" aria-label="ASTRO BLAST"></canvas>
    </div>
  </section>

  <section class="controls" aria-label="Arcade controls">
    <div class="control-row">
      <div class="ctrl-wrap">
        <div class="ctrl-label">MOVE</div>
        <button class="ctrl" data-action="left" aria-label="Move left">◀</button>
      </div>
      <div class="ctrl-wrap">
        <div class="ctrl-label">MOVE</div>
        <button class="ctrl" data-action="right" aria-label="Move right">▶</button>
      </div>
      <div class="ctrl-wrap">
        <div class="ctrl-label">FIRE / SELECT</div>
        <button class="ctrl round" data-action="fire" aria-label="Fire"></button>
      </div>
      <div class="ctrl-wrap">
        <div class="ctrl-label">BOMB / BACK</div>
        <button class="ctrl round" data-action="bomb" aria-label="Bomb"></button>
      </div>
      <div class="ctrl-wrap">
        <div class="ctrl-label">HYPER</div>
        <button class="ctrl round" data-action="hyper" aria-label="Hyper"></button>
      </div>
    </div>
    <div class="slogan"><span>DEFEND</span><span>EXPLORE</span><span>SURVIVE</span></div>
  </section>
</main>

<script>
(() => {
"use strict";

const c = document.getElementById("game");
const x = c.getContext("2d",{alpha:false});
const W = c.width, H = c.height;
x.imageSmoothingEnabled = false;

const WHITE="#f1f1f1", GRAY="#9a9a9a", DIM="#5e5e5e", BLACK="#020202";
const SAVE_KEY="astro-blast-arcade-v3";
const baseSave={hi:0,credits:0,sfx:true,up:{shield:0,fire:0,hyper:0,bomb:0}};
let save=load();
function load(){
  try{
    const a=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    return a?{...structuredClone(baseSave),...a,up:{...baseSave.up,...(a.up||{})}}:structuredClone(baseSave);
  }catch{return structuredClone(baseSave)}
}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}

const S={
  mode:"menu", menu:0, upgrade:0, t:0, last:performance.now(),
  score:0,sector:1,flash:0,shake:0,spawn:.2,enemySpawn:3,
  player:null,stars:[],asteroids:[],enemies:[],bullets:[],ebullets:[],particles:[],
  pressed:{left:false,right:false,fire:false,hyper:false},
  firePulse:false
};

for(let i=0;i<95;i++) S.stars.push({
  x:Math.floor(Math.random()*W/4)*4,
  y:Math.floor(Math.random()*H/4)*4,
  s:Math.random()<.82?2:4,
  v:18+Math.random()*38
});

/* Selected ship: deliberately low-detail, large-pixel, two-tone A/boomerang silhouette */
const SHIP = [
"........WWWW........",
".......WWWWWW.......",
"......WWWWWWWW......",
".....WWWWWWWWWW.....",
"....WWWWGGWWWWWW....",
"...WWWWWGGWWWWWWW...",
"...WWWWWGGWWWWWWW...",
"..WWWWWWGGWWWWWWWW..",
"..WWWWWWGGWWWWWWWW..",
".WWWWGWWGGWWGWWWWWW.",
".WWWGGWWWWWWGGWWWWW.",
"WWWGGWWWWWWWWGGWWWWW",
"WWGGWWWWWWWWWWGGWWWW",
"WWGGWWWW..WWWWGGWWWW",
"WGGWWWW....WWWWGGWWW",
"WGGWWW......WWWGGWWW",
"GGWWW........WWWGGWW",
"GGWW..........WWGGWW",
"GWWW..........WWWGWW",
"GWW............WWGWW",
"WWW............WWWWW"
];

const ENEMY = [
"..W..W..",
".WWWWWW.",
"WWGWWGWW",
".WWWWWW.",
"..W..W..",
".W....W."
];

const AST = [
"..WW..",
".WGGW.",
"WGWWGW",
"WWGGWW",
".WGGW.",
"..WW.."
];

const EXP=["#ff2600","#ff5a00","#ff9800","#ffd000","#fff06a","#ffffff","#00d8ff"];

const buttons=[...document.querySelectorAll("[data-action]")];
for(const b of buttons){
  const act=b.dataset.action;
  const down=e=>{
    e.preventDefault(); ensureAudio(); b.classList.add("active");
    if(act==="left"||act==="right"||act==="fire"||act==="hyper") S.pressed[act]=true;
    if(act==="fire") onFirePress();
    if(act==="bomb") onBombPress();
    if(act==="hyper") onHyperPress();
  };
  const up=e=>{
    e.preventDefault(); b.classList.remove("active");
    if(act==="left"||act==="right"||act==="fire"||act==="hyper") S.pressed[act]=false;
  };
  b.addEventListener("pointerdown",down);
  b.addEventListener("pointerup",up);
  b.addEventListener("pointercancel",up);
  b.addEventListener("pointerleave",e=>{if(e.buttons===0)up(e)});
}

addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","Space","Enter"].includes(e.code))e.preventDefault();
  if(e.code==="ArrowLeft"||e.code==="KeyA")S.pressed.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD")S.pressed.right=true;
  if(e.code==="Space"||e.code==="Enter"){
    if(!S.pressed.fire)onFirePress();
    S.pressed.fire=true;
  }
  if(e.code==="KeyB")onBombPress();
  if(e.code==="ShiftLeft"||e.code==="ShiftRight"||e.code==="KeyH"){S.pressed.hyper=true;onHyperPress()}
  if(e.code==="Escape")backAction();
});
addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA")S.pressed.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")S.pressed.right=false;
  if(e.code==="Space"||e.code==="Enter")S.pressed.fire=false;
  if(e.code==="ShiftLeft"||e.code==="ShiftRight"||e.code==="KeyH")S.pressed.hyper=false;
});

function onFirePress(){
  ensureAudio();
  if(S.mode==="menu")selectMenu();
  else if(S.mode==="upgrade")buyUpgrade();
  else if(S.mode==="gameover")startGame();
  else if(S.mode==="settings"){save.sfx=!save.sfx;persist();blip(620,.05,.035)}
  else if(S.mode==="score"){S.mode="menu";blip(260,.05,.03)}
  else if(S.mode==="play")S.firePulse=true;
}
function onBombPress(){
  ensureAudio();
  if(S.mode==="play")useBomb();
  else backAction();
}
function onHyperPress(){
  ensureAudio();
  if(S.mode==="play")useHyper();
  else if(S.mode==="menu"){S.menu=(S.menu+1)%4;blip(380,.04,.025)}
}
function backAction(){
  if(["upgrade","score","settings","gameover"].includes(S.mode)){S.mode="menu";blip(240,.05,.03)}
}
function selectMenu(){
  blip(700,.06,.04);
  if(S.menu===0)startGame();
  if(S.menu===1)S.mode="upgrade";
  if(S.menu===2)S.mode="score";
  if(S.menu===3)S.mode="settings";
}

function startGame(){
  S.mode="play";S.score=0;S.sector=1;S.spawn=.15;S.enemySpawn=2.5;
  S.asteroids.length=S.enemies.length=S.bullets.length=S.ebullets.length=S.particles.length=0;
  S.player={
    x:W/2,y:H-92,w:82,h:84,
    hp:4+save.up.shield,maxHp:4+save.up.shield,
    inv:0,fire:0,
    bombs:1+save.up.bomb,
    hyper:100,hyperOn:0
  };
  S.flash=.2; startSound();
}

function update(dt){
  S.t+=dt;
  if(S.flash>0)S.flash-=dt;
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*28);

  const scroll=S.mode==="play"?(78+S.sector*7):18;
  for(const s of S.stars){
    s.y+=s.v*dt*(scroll/55);
    if(s.y>H){s.y=-4;s.x=Math.floor(Math.random()*W/4)*4}
  }

  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;
    if(p.life<=0)S.particles.splice(i,1);
  }

  if(S.mode!=="play")return;
  const p=S.player;
  p.inv=Math.max(0,p.inv-dt);
  p.fire-=dt;
  p.hyperOn=Math.max(0,p.hyperOn-dt);
  p.hyper=Math.min(100,p.hyper+dt*(p.hyperOn>0?0:5));

  const speed=235*(1+save.up.hyper*.02);
  if(S.pressed.left)p.x-=speed*dt;
  if(S.pressed.right)p.x+=speed*dt;
  p.x=Math.max(55,Math.min(W-55,p.x));

  const rate=Math.max(.10,.22-save.up.fire*.025);
  if((S.pressed.fire||S.firePulse)&&p.fire<=0){shoot();p.fire=rate;S.firePulse=false}

  S.score+=dt*(22+S.sector*2)*(p.hyperOn>0?2:1);
  S.sector=1+Math.floor(S.score/900);

  S.spawn-=dt;
  if(S.spawn<=0){spawnAsteroid();S.spawn=Math.max(.22,.7-S.sector*.035)*(0.72+Math.random()*.62)}
  S.enemySpawn-=dt;
  if(S.enemySpawn<=0){spawnEnemy();S.enemySpawn=Math.max(1.5,4.2-S.sector*.1)*(0.8+Math.random()*.5)}

  for(let i=S.bullets.length-1;i>=0;i--){
    const b=S.bullets[i];b.y-=410*dt;
    if(b.y<-20){S.bullets.splice(i,1);continue}
  }
  for(let i=S.ebullets.length-1;i>=0;i--){
    const b=S.ebullets[i];b.y+=170*dt;
    if(b.y>H+20){S.ebullets.splice(i,1);continue}
    if(p.inv<=0&&Math.abs(b.x-p.x)<28&&Math.abs(b.y-p.y)<34){S.ebullets.splice(i,1);damage(b.x,b.y)}
  }
  for(let i=S.asteroids.length-1;i>=0;i--){
    const a=S.asteroids[i];a.y+=a.v*dt;
    if(a.y>H+55){S.asteroids.splice(i,1);continue}
    if(p.inv<=0&&d2(a.x,a.y,p.x,p.y)<(a.r+30)*(a.r+30)){S.asteroids.splice(i,1);damage(a.x,a.y)}
  }
  for(let i=S.enemies.length-1;i>=0;i--){
    const e=S.enemies[i];e.y+=e.v*dt;e.phase+=dt;e.x+=Math.sin(e.phase*3)*18*dt;e.fire-=dt;
    if(e.fire<=0){S.ebullets.push({x:e.x,y:e.y+15});e.fire=1.2+Math.random()*1.3;enemySound()}
    if(e.y>H+50){S.enemies.splice(i,1);continue}
    if(p.inv<=0&&Math.abs(e.x-p.x)<42&&Math.abs(e.y-p.y)<42){S.enemies.splice(i,1);damage(e.x,e.y)}
  }

  for(let bi=S.bullets.length-1;bi>=0;bi--){
    const b=S.bullets[bi];let gone=false;
    for(let ai=S.asteroids.length-1;ai>=0;ai--){
      const a=S.asteroids[ai];
      if(d2(b.x,b.y,a.x,a.y)<(a.r+7)*(a.r+7)){
        a.hp--;S.bullets.splice(bi,1);gone=true;spark(a.x,a.y);
        if(a.hp<=0){S.asteroids.splice(ai,1);boom(a.x,a.y,22,false);S.score+=75}
        break;
      }
    }
    if(gone)continue;
    for(let ei=S.enemies.length-1;ei>=0;ei--){
      const e=S.enemies[ei];
      if(Math.abs(b.x-e.x)<28&&Math.abs(b.y-e.y)<25){
        e.hp--;S.bullets.splice(bi,1);gone=true;spark(e.x,e.y);
        if(e.hp<=0){S.enemies.splice(ei,1);boom(e.x,e.y,28,false);S.score+=140}
        break;
      }
    }
  }
}

function shoot(){
  const p=S.player;
  S.bullets.push({x:p.x,y:p.y-50});
  if(save.up.fire>=4){S.bullets.push({x:p.x-18,y:p.y-37},{x:p.x+18,y:p.y-37})}
  laserSound();
}
function spawnAsteroid(){
  const r=[16,20,24,28][Math.floor(Math.random()*4)];
  S.asteroids.push({x:35+Math.random()*(W-70),y:-50,r,v:95+S.sector*8+Math.random()*55,hp:r>=24?2:1})
}
function spawnEnemy(){
  S.enemies.push({x:55+Math.random()*(W-110),y:-45,v:80+S.sector*5,hp:1+Math.floor(S.sector/5),fire:.7+Math.random()*1.2,phase:Math.random()*6.28})
}
function damage(px,py){
  const p=S.player;
  if(p.hyperOn>0)return;
  p.hp--;p.inv=1.1;S.shake=10;S.flash=.12;boom(px,py,24,false);hitSound();
  if(p.hp<=0)setTimeout(gameOver,60)
}
function gameOver(){
  if(S.mode!=="play")return;
  boom(S.player.x,S.player.y,55,true);S.shake=18;S.flash=.45;
  const earn=Math.floor(S.score/120);
  save.credits+=earn;save.hi=Math.max(save.hi,Math.floor(S.score));persist();
  S.mode="gameover";overSound();
}
function useBomb(){
  const p=S.player;if(!p||p.bombs<=0)return fail();
  p.bombs--;S.flash=.18;S.shake=8;
  for(const a of S.asteroids)boom(a.x,a.y,18,false);
  for(const e of S.enemies)boom(e.x,e.y,22,false);
  S.score+=(S.asteroids.length*45+S.enemies.length*90);
  S.asteroids.length=0;S.enemies.length=0;S.ebullets.length=0;
  bombSound();
}
function useHyper(){
  const p=S.player;if(!p||p.hyper<35||p.hyperOn>0)return fail();
  p.hyper-=35;p.hyperOn=1.25;p.inv=1.25;hyperSound();
  for(let i=0;i<24;i++)spark(p.x+(Math.random()-.5)*55,p.y+(Math.random()-.5)*50,"#00d8ff")
}

const upgradeDefs=[
  ["SHIELD","shield",80],
  ["FIRE RATE","fire",110],
  ["HYPER","hyper",100],
  ["BOMB","bomb",140]
];
function buyUpgrade(){
  const d=upgradeDefs[S.upgrade], lvl=save.up[d[1]];
  if(lvl>=5)return fail();
  const cost=Math.floor(d[2]*(1+lvl*.7));
  if(save.credits<cost)return fail();
  save.credits-=cost;save.up[d[1]]++;persist();powerup();
}
function nextUpgrade(dir){
  S.upgrade=(S.upgrade+dir+upgradeDefs.length)%upgradeDefs.length;blip(350+S.upgrade*40,.04,.025)
}

function draw(){
  x.save();
  if(S.shake>0)x.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  x.fillStyle=BLACK;x.fillRect(0,0,W,H);
  drawStars();

  if(S.mode==="menu")drawMenu();
  if(S.mode==="play")drawPlay();
  if(S.mode==="gameover")drawGameOver();
  if(S.mode==="upgrade")drawUpgrade();
  if(S.mode==="score")drawScore();
  if(S.mode==="settings")drawSettings();

  if(S.flash>0){x.globalAlpha=Math.min(.5,S.flash*1.7);x.fillStyle="#fff";x.fillRect(0,0,W,H);x.globalAlpha=1}
  x.restore();
}
function drawStars(){
  x.fillStyle="#d7d7d7";
  for(const s of S.stars){x.globalAlpha=s.a||.72;x.fillRect(s.x|0,s.y|0,s.s,s.s)}
  x.globalAlpha=1;
}
function hudText(t,px,py,size=18,align="left",col=WHITE){
  x.fillStyle=col;x.font=`bold ${size}px "Courier New",monospace`;x.textAlign=align;x.textBaseline="top";x.fillText(t,px,py)
}
function drawMenu(){
  hudText("ASTRO BLAST",W/2,90,42,"center",WHITE);
  hudText("1983 ORBITAL ARCADE",W/2,140,15,"center",GRAY);
  drawSprite(SHIP,W/2,280,5);

  const items=["START","UPGRADES","HIGH SCORE","SETTINGS"];
  for(let i=0;i<items.length;i++){
    const yy=408+i*36;
    hudText((S.menu===i?"> ":"  ")+items[i]+(S.menu===i?" <":""),W/2,yy,19,"center",S.menu===i?WHITE:GRAY);
  }
  hudText("◀ ▶ SELECT   FIRE CONFIRM",W/2,558,13,"center",DIM);
}
function drawPlay(){
  hudText("SCORE",28,22,17);hudText(String(Math.floor(S.score)).padStart(6,"0"),28,43,24);
  hudText("HI-SCORE",W/2,22,17,"center");hudText(String(save.hi).padStart(6,"0"),W/2,43,24,"center");
  hudText("SHIELD",W-28,22,17,"right");
  const p=S.player;
  for(let i=0;i<p.maxHp;i++){
    x.strokeStyle=GRAY;x.lineWidth=2;x.strokeRect(W-28-p.maxHp*18+i*18,47,13,13);
    if(i<p.hp){x.fillStyle=WHITE;x.fillRect(W-26-p.maxHp*18+i*18,49,9,9)}
  }
  hudText("BOMB "+String(p.bombs),W-28,68,13,"right",GRAY);
  hudText("HYPER",W-28,87,13,"right",GRAY);
  x.strokeStyle=GRAY;x.strokeRect(W-126,107,98,10);
  x.fillStyle=p.hyperOn>0?"#00d8ff":WHITE;x.fillRect(W-123,110,92*(p.hyper/100),4);

  for(const a of S.asteroids)drawAsteroid(a.x,a.y,a.r);
  for(const e of S.enemies)drawSprite(ENEMY,e.x,e.y,5);
  for(const b of S.bullets){x.fillStyle=WHITE;x.fillRect((b.x-3)|0,(b.y-10)|0,6,16)}
  for(const b of S.ebullets){x.fillStyle=GRAY;x.fillRect((b.x-3)|0,b.y|0,6,12)}

  for(const q of S.particles){
    x.globalAlpha=Math.max(0,q.life/q.max);
    x.fillStyle=q.c;x.fillRect(q.x|0,q.y|0,q.s,q.s);
  }
  x.globalAlpha=1;

  if(p.inv<=0||Math.floor(p.inv*12)%2===0)drawSprite(SHIP,p.x,p.y,4);
  hudText("SECTOR "+S.sector,W/2,H-30,15,"center",GRAY);
}
function drawGameOver(){
  hudText("GAME OVER",W/2,95,44,"center");
  staticExplosion(W/2,220);
  hudText("SCORE",W/2,305,16,"center",GRAY);
  hudText(String(Math.floor(S.score)).padStart(6,"0"),W/2,327,28,"center");

}
function drawUpgrade(){
  hudText("UPGRADES",W/2,58,35,"center");
  hudText("CREDITS "+String(save.credits).padStart(5,"0"),W/2,104,16,"center",GRAY);
  const ys=[190,270,350,430];
  for(let i=0;i<upgradeDefs.length;i++){
    const [name,key,c0]=upgradeDefs[i],lvl=save.up[key],yy=ys[i];
    if(i===S.upgrade){x.strokeStyle=WHITE;x.lineWidth=2;x.strokeRect(55,yy-16,W-110,52)}
    hudText(name,78,yy,16,"left",i===S.upgrade?WHITE:GRAY);
    for(let j=0;j<5;j++){
      x.strokeStyle=GRAY;x.strokeRect(310+j*28,yy-2,19,19);
      if(j<lvl){x.fillStyle=WHITE;x.fillRect(314+j*28,yy+2,11,11)}
    }
    const price=lvl>=5?"MAX":Math.floor(c0*(1+lvl*.7));
    hudText(String(price),W-78,yy,16,"right",GRAY);
  }
  hudText("◀ ▶ CHOOSE",W/2,522,13,"center",DIM);

}
function drawScore(){
  hudText("HIGH SCORE",W/2,120,34,"center");
  hudText(String(save.hi).padStart(6,"0"),W/2,192,48,"center");
  hudText("CREDITS "+String(save.credits).padStart(5,"0"),W/2,280,17,"center",GRAY);
  hudText("FIRE / BOMB : BACK",W/2,510,14,"center",DIM);
}
function drawSettings(){
  hudText("SETTINGS",W/2,120,34,"center");
  hudText("SFX",160,260,22,"left");
  hudText(save.sfx?"ON":"OFF",W-160,260,22,"right");
  x.strokeStyle=WHITE;x.strokeRect(125,245,W-250,54);
  hudText("FIRE : TOGGLE",W/2,350,14,"center",DIM);
  hudText("BOMB : BACK",W/2,380,14,"center",DIM);

function drawSprite(map,cx,cy,scale){
  const rows=map.length, cols=Math.max(...map.map(r=>r.length));
  const ox=Math.round(cx-cols*scale/2), oy=Math.round(cy-rows*scale/2);
  for(let yy=0;yy<rows;yy++){
    const row=map[yy];
    for(let xx=0;xx<row.length;xx++){
      const ch=row[xx];
      if(ch==="W"){x.fillStyle=WHITE;x.fillRect(ox+xx*scale,oy+yy*scale,scale,scale)}
      else if(ch==="G"){x.fillStyle=GRAY;x.fillRect(ox+xx*scale,oy+yy*scale,scale,scale)}
    }
  }
}
function drawAsteroid(cx,cy,r){
  const s=Math.max(3,Math.round(r/6));
  const scale=Math.max(3,Math.round(r/6));
  drawSprite(AST,cx,cy,scale);
}
function spark(px,py,col=WHITE){
  for(let i=0;i<6;i++)S.particles.push({x:px,y:py,vx:(Math.random()-.5)*110,vy:(Math.random()-.5)*110,g:0,life:.18,max:.18,s:4,c:col})
}
function boom(px,py,size,major){
  const n=major?54:22;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(major?70:40)+Math.random()*(major?180:110);
    S.particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:8,life:.18+Math.random()*.55,max:.73,s:4+[0,0,4][Math.floor(Math.random()*3)],c:EXP[Math.floor(Math.random()*EXP.length)]})
  }
  explosionSound(major);
}
function staticExplosion(cx,cy){
  for(let i=0;i<40;i++){
    const a=i/40*Math.PI*2,r=8+(i%8)*5;
    x.fillStyle=EXP[i%EXP.length];
    x.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),8,8);
  }
}
function d2(x1,y1,x2,y2){const a=x1-x2,b=y1-y2;return a*a+b*b}

/* AUDIO — synthesized 1980s arcade SFX */
let audio=null,master=null;
function ensureAudio(){
  if(audio)return;
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain();master.gain.value=.22;master.connect(audio.destination);
}
function tone(f,d=.06,v=.04,type="square",to=null){
  if(!save.sfx)return;ensureAudio();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(35,to),audio.currentTime+d);
  g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);
  o.connect(g).connect(master);o.start();o.stop(audio.currentTime+d);
}
function noise(d=.12,v=.05){
  if(!save.sfx)return;ensureAudio();
  const len=Math.floor(audio.sampleRate*d),buf=audio.createBuffer(1,len,audio.sampleRate),arr=buf.getChannelData(0);
  for(let i=0;i<len;i++)arr[i]=(Math.random()*2-1)*(1-i/len);
  const src=audio.createBufferSource(),g=audio.createGain();src.buffer=buf;g.gain.value=v;src.connect(g).connect(master);src.start()
}
const blip=(f,d,v)=>tone(f,d,v,"square",f*.8);
function laserSound(){tone(940,.04,.018,"square",370)}
function enemySound(){tone(230,.05,.016,"square",340)}
function hitSound(){noise(.12,.055);tone(120,.15,.035,"square",65)}
function explosionSound(m){noise(m?.42:.18,m?.09:.05);tone(m?90:130,m?.32:.14,m?.05:.03,"square",55)}
function bombSound(){noise(.35,.08);tone(80,.4,.05,"sawtooth",42)}
function hyperSound(){tone(220,.12,.035,"square",880);setTimeout(()=>tone(880,.08,.025),90)}
function powerup(){tone(420,.08,.04,"square",680);setTimeout(()=>tone(700,.1,.035,"square",980),70)}
function fail(){tone(125,.12,.03,"square",65)}
function startSound(){tone(220,.07,.03);setTimeout(()=>tone(440,.08,.035),75);setTimeout(()=>tone(880,.1,.03),150)}
function overSound(){tone(220,.12,.04,"square",140);setTimeout(()=>tone(120,.24,.045,"square",60),120)}

function loop(t){
  const dt=Math.min(.033,(t-S.last)/1000||0);S.last=t;
  // menu navigation via held left/right with debounce by state pulse
  if(S.mode==="menu"){
    if(S.pressed.left&&!S._navL){S.menu=(S.menu+3)%4;blip(330,.04,.025)}
    if(S.pressed.right&&!S._navR){S.menu=(S.menu+1)%4;blip(410,.04,.025)}
    S._navL=S.pressed.left;S._navR=S.pressed.right;
  }else if(S.mode==="upgrade"){
    if(S.pressed.left&&!S._navL)nextUpgrade(-1);
    if(S.pressed.right&&!S._navR)nextUpgrade(1);
    S._navL=S.pressed.left;S._navR=S.pressed.right;
  }else{
    S._navL=S.pressed.left;S._navR=S.pressed.right;
  }
  update(dt);draw();requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

})();
