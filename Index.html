<!doctype html>

<style>
:root{--black:#020202;--white:#f1f1f1;--gray:#989898;--dim:#5c5c5c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
body{min-height:100dvh;display:grid;place-items:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));font-family:"Courier New",monospace;color:#fff}
.machine{width:min(94vw,540px,calc(100dvh - 176px));max-width:540px;display:flex;flex-direction:column;gap:7px;padding:7px;border:2px solid #505050;border-radius:20px;background:linear-gradient(90deg,#090909 0 5%,#181818 5% 8%,#0a0a0a 8% 92%,#181818 92% 95%,#090909 95%);box-shadow:0 12px 40px rgba(0,0,0,.85)}

.btn{appearance:none;-webkit-appearance:none;width:100%;min-width:0;height:48px;border:2px solid #d2d2d2;border-radius:7px;background:#111;color:#fff;font:900 21px/1 monospace;box-shadow:inset 0 3px 0 #3f3f3f,inset 0 -6px 0 #050505,0 4px 0 #020202;touch-action:none;-webkit-tap-highlight-color:transparent}
.btn.round{width:46px;height:46px;justify-self:center;border-radius:50%;background:radial-gradient(circle at 44% 32%,#f0f0f0 0 41%,#aaa 42% 57%,#171717 58%);box-shadow:0 4px 0 #020202,0 0 0 2px #333}.btn.pressed{transform:translateY(3px);box-shadow:inset 0 2px 0 #303030,inset 0 -3px 0 #050505,0 1px 0 #020202}

<body>
<main class="machine">
<header class="marquee"><div class="marquee-mark">━━≡</div><div class="marquee-title">ARTBLAST</div><div class="marquee-mark right">INSERT<br>COIN</div></header>
<section class="bezel"><div class="screen"><canvas id="game" width="512" height="512"></canvas></div></section>
<section class="controls"><div class="control-row">
<div class="control"><div class="label">MOVE</div><button class="btn" data-action="left">◀</button></div>
<div class="control"><div class="label">MOVE</div><button class="btn" data-action="right">▶</button></div>
<div class="control"><div class="label">FIRE</div><button class="btn round" data-action="fire"></button></div>
<div class="control"><div class="label">BOMB</div><button class="btn round" data-action="bomb"></button></div>
<div class="control"><div class="label">HYPER</div><button class="btn round" data-action="hyper"></button></div>
</div><div class="footer"><span>DEFEND</span><span>EXPLORE</span><span>SURVIVE</span></div></section>
</main>
<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false}),W=512,H=512;ctx.imageSmoothingEnabled=false;
const C={black:"#020202",white:"#f1f1f1",gray:"#989898",dim:"#5c5c5c"};
const SAVE_KEY="astro-blast-square-v4",DEF={hi:0,credits:0,sfx:true,up:{shield:0,fire:0,bomb:0,hyper:0}};let save=loadSave();
function loadSave(){try{const v=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return v?{...structuredClone(DEF),...v,up:{...DEF.up,...(v.up||{})}}:structuredClone(DEF)}catch(e){return structuredClone(DEF)}}function store(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
const FONT={
A:["01110","10001","10001","11111","10001","10001","10001"],B:["11110","10001","10001","11110","10001","10001","11110"],C:["01111","10000","10000","10000","10000","10000","01111"],D:["11110","10001","10001","10001","10001","10001","11110"],E:["11111","10000","10000","11110","10000","10000","11111"],F:["11111","10000","10000","11110","10000","10000","10000"],G:["01111","10000","10000","10111","10001","10001","01111"],H:["10001","10001","10001","11111","10001","10001","10001"],I:["11111","00100","00100","00100","00100","00100","11111"],J:["00111","00010","00010","00010","10010","10010","01100"],K:["10001","10010","10100","11000","10100","10010","10001"],L:["10000","10000","10000","10000","10000","10000","11111"],M:["10001","11011","10101","10101","10001","10001","10001"],N:["10001","11001","10101","10011","10001","10001","10001"],O:["01110","10001","10001","10001","10001","10001","01110"],P:["11110","10001","10001","11110","10000","10000","10000"],Q:["01110","10001","10001","10001","10101","10010","01101"],R:["11110","10001","10001","11110","10100","10010","10001"],S:["01111","10000","10000","01110","00001","00001","11110"],T:["11111","00100","00100","00100","00100","00100","00100"],U:["10001","10001","10001","10001","10001","10001","01110"],V:["10001","10001","10001","10001","10001","01010","00100"],W:["10001","10001","10001","10101","10101","10101","01010"],X:["10001","10001","01010","00100","01010","10001","10001"],Y:["10001","10001","01010","00100","00100","00100","00100"],Z:["11111","00001","00010","00100","01000","10000","11111"],
0:["01110","10001","10011","10101","11001","10001","01110"],1:["00100","01100","00100","00100","00100","00100","01110"],2:["01110","10001","00001","00010","00100","01000","11111"],3:["11110","00001","00001","01110","00001","00001","11110"],4:["00010","00110","01010","10010","11111","00010","00010"],5:["11111","10000","10000","11110","00001","00001","11110"],6:["01110","10000","10000","11110","10001","10001","01110"],7:["11111","00001","00010","00100","01000","01000","01000"],8:["01110","10001","10001","01110","10001","10001","01110"],9:["01110","10001","10001","01111","00001","00001","01110"],
"-":["00000","00000","00000","11111","00000","00000","00000"],":":["00000","00100","00100","00000","00100","00100","00000"],"/ ":["00001","00010","00010","00100","01000","01000","10000"],">":["10000","01000","00100","00010","00100","01000","10000"],"<":["00001","00010","00100","01000","00100","00010","00001"]," ":["00000","00000","00000","00000","00000","00000","00000"]};
FONT["/"]=["00001","00010","00010","00100","01000","01000","10000"];
function pixelText(str,x,y,scale=3,color=C.white,align="left"){str=String(str).toUpperCase();const step=6*scale,width=str.length*step-scale;let ox=x;if(align==="center")ox=x-width/2;if(align==="right")ox=x-width;ctx.fillStyle=color;for(let ci=0;ci<str.length;ci++){const glyph=FONT[str[ci]]||FONT[" "];for(let gy=0;gy<7;gy++)for(let gx=0;gx<5;gx++)if(glyph[gy][gx]==="1")ctx.fillRect(Math.round(ox+ci*step+gx*scale),Math.round(y+gy*scale),scale,scale)}}
const SHIP=["........WWWW........",".......WWWWWW.......","......WWWWWWWW......",".....WWWWWWWWWW.....","....WWWWGGWWWWWW....","...WWWWWGGWWWWWWW...","...WWWWWGGWWWWWWW...","..WWWWWWGGWWWWWWWW..","..WWWWWWGGWWWWWWWW..",".WWWWGWWGGWWGWWWWWW.",".WWWGGWWWWWWGGWWWWW.","WWWGGWWWWWWWWGGWWWWW","WWGGWWWWWWWWWWGGWWWW","WWGGWWWW..WWWWGGWWWW","WGGWWWW....WWWWGGWWW","WGGWWW......WWWGGWWW","GGWWW........WWWGGWW","GGWW..........WWGGWW","GWWW..........WWWGWW","GWW............WWGWW","WWW............WWWWW"];
const ENEMY=["..W..W..",".WWWWWW.","WWGWWGWW",".WWWWWW.","..W..W..",".W....W."],ROCK1=["..WW...",".WGGW..","WGWWW..","WWGGWW.",".WGGGW.","..WWW.."],ROCK2=["...WW..",".WWWGW.","WWGGGW.","WGGWWW.",".WWGW..","..WW..."];
function drawSprite(sprite,cx,cy,scale){const rows=sprite.length,cols=Math.max(...sprite.map(r=>r.length)),ox=Math.round(cx-cols*scale/2),oy=Math.round(cy-rows*scale/2);for(let yy=0;yy<rows;yy++){const row=sprite[yy];for(let xx=0;xx<row.length;xx++){const ch=row[xx];if(ch==="W"){ctx.fillStyle=C.white;ctx.fillRect(ox+xx*scale,oy+yy*scale,scale,scale)}else if(ch==="G"){ctx.fillStyle=C.gray;ctx.fillRect(ox+xx*scale,oy+yy*scale,scale,scale)}}}}
const S={mode:"menu",menu:0,upgrade:0,t:0,last:performance.now(),score:0,sector:1,player:null,stars:[],rocks:[],enemies:[],bullets:[],enemyBullets:[],particles:[],spawn:0,enemySpawn:2,flash:0,shake:0,pressed:{left:false,right:false,fire:false,hyper:false},firePulse:false};
for(let i=0;i<70;i++)S.stars.push({x:Math.floor(Math.random()*128)*4,y:Math.floor(Math.random()*128)*4,s:Math.random()<.85?2:4,v:12+Math.random()*30,a:.35+Math.random()*.6});
const EXP=["#ff2a00","#ff6a00","#ffb000","#ffe65c","#ffffff","#00d8ff"];
function resetGame(){S.mode="play";S.score=0;S.sector=1;S.rocks.length=S.enemies.length=S.bullets.length=S.enemyBullets.length=S.particles.length=0;S.spawn=.2;S.enemySpawn=2.3;S.player={x:W/2,y:H-72,hp:4+save.up.shield,maxHp:4+save.up.shield,inv:0,fireCd:0,bombs:1+save.up.bomb,hyper:100,hyperOn:0};S.flash=.18;startSound()}
function update(dt){S.t+=dt;if(S.flash>0)S.flash-=dt;if(S.shake>0)S.shake=Math.max(0,S.shake-dt*25);for(const st of S.stars){st.y+=st.v*(S.mode==="play"?1.5:.55)*dt;if(st.y>H){st.y=-4;st.x=Math.floor(Math.random()*128)*4}}for(let i=S.particles.length-1;i>=0;i--){const p=S.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;if(p.life<=0)S.particles.splice(i,1)}if(S.mode!=="play")return;const p=S.player;p.inv=Math.max(0,p.inv-dt);p.fireCd-=dt;p.hyperOn=Math.max(0,p.hyperOn-dt);if(p.hyperOn<=0)p.hyper=Math.min(100,p.hyper+dt*5);const moveSpeed=210;if(S.pressed.left)p.x-=moveSpeed*dt;if(S.pressed.right)p.x+=moveSpeed*dt;p.x=Math.max(40,Math.min(W-40,p.x));const fireRate=Math.max(.09,.21-save.up.fire*.025);if((S.pressed.fire||S.firePulse)&&p.fireCd<=0){fire();p.fireCd=fireRate;S.firePulse=false}S.score+=dt*(24+S.sector*2)*(p.hyperOn>0?2:1);S.sector=1+Math.floor(S.score/950);S.spawn-=dt;if(S.spawn<=0){spawnRock();S.spawn=Math.max(.2,.68-S.sector*.025)*(.75+Math.random()*.55)}S.enemySpawn-=dt;if(S.enemySpawn<=0){spawnEnemy();S.enemySpawn=Math.max(1.4,4-S.sector*.08)*(.8+Math.random()*.5)}for(let i=S.bullets.length-1;i>=0;i--){const b=S.bullets[i];b.y-=400*dt;if(b.y<-10)S.bullets.splice(i,1)}for(let i=S.enemyBullets.length-1;i>=0;i--){const b=S.enemyBullets[i];b.y+=155*dt;if(b.y>H+10){S.enemyBullets.splice(i,1);continue}if(p.inv<=0&&Math.abs(b.x-p.x)<25&&Math.abs(b.y-p.y)<25){S.enemyBullets.splice(i,1);damage(b.x,b.y)}}for(let i=S.rocks.length-1;i>=0;i--){const a=S.rocks[i];a.y+=a.v*dt;if(a.y>H+25){S.rocks.splice(i,1);continue}if(p.inv<=0&&dist2(a.x,a.y,p.x,p.y)<(a.r+24)*(a.r+24)){S.rocks.splice(i,1);damage(a.x,a.y)}}for(let i=S.enemies.length-1;i>=0;i--){const e=S.enemies[i];e.y+=e.v*dt;e.phase+=dt;e.x+=Math.sin(e.phase*3)*14*dt;e.fire-=dt;if(e.fire<=0){S.enemyBullets.push({x:e.x,y:e.y+14});e.fire=1.2+Math.random()*1.2;enemySound()}if(e.y>H+30){S.enemies.splice(i,1);continue}if(p.inv<=0&&Math.abs(e.x-p.x)<30&&Math.abs(e.y-p.y)<30){S.enemies.splice(i,1);damage(e.x,e.y)}}for(let bi=S.bullets.length-1;bi>=0;bi--){const b=S.bullets[bi];let gone=false;for(let ai=S.rocks.length-1;ai>=0;ai--){const a=S.rocks[ai];if(dist2(b.x,b.y,a.x,a.y)<(a.r+7)*(a.r+7)){a.hp--;S.bullets.splice(bi,1);gone=true;spark(a.x,a.y);if(a.hp<=0){S.rocks.splice(ai,1);boom(a.x,a.y,20,false);S.score+=70}break}}if(gone)continue;for(let ei=S.enemies.length-1;ei>=0;ei--){const e=S.enemies[ei];if(Math.abs(b.x-e.x)<22&&Math.abs(b.y-e.y)<22){e.hp--;S.bullets.splice(bi,1);gone=true;spark(e.x,e.y);if(e.hp<=0){S.enemies.splice(ei,1);boom(e.x,e.y,24,false);S.score+=130}break}}}}
function fire(){const p=S.player;S.bullets.push({x:p.x,y:p.y-42});if(save.up.fire>=4)S.bullets.push({x:p.x-15,y:p.y-30},{x:p.x+15,y:p.y-30});laserSound()}
function spawnRock(){const large=Math.random()>.65;S.rocks.push({x:35+Math.random()*(W-70),y:-24,v:82+S.sector*7+Math.random()*45,r:large?22:16,hp:large?2:1,sprite:Math.random()>.5?ROCK1:ROCK2})}
function spawnEnemy(){S.enemies.push({x:55+Math.random()*(W-110),y:-25,v:72+S.sector*4,hp:1+Math.floor(S.sector/6),fire:.7+Math.random()*1.2,phase:Math.random()*Math.PI*2})}
function damage(px,py){const p=S.player;if(p.hyperOn>0)return;p.hp--;p.inv=1;S.flash=.12;S.shake=8;boom(px,py,20,false);hitSound();if(p.hp<=0)setTimeout(gameOver,50)}
function gameOver(){if(S.mode!=="play")return;boom(S.player.x,S.player.y,44,true);S.shake=13;S.flash=.35;save.credits+=Math.floor(S.score/130);save.hi=Math.max(save.hi,Math.floor(S.score));store();S.mode="gameover";overSound()}
function bomb(){if(S.mode!=="play")return back();const p=S.player;if(p.bombs<=0)return fail();p.bombs--;for(const a of S.rocks)boom(a.x,a.y,16,false);for(const e of S.enemies)boom(e.x,e.y,20,false);S.score+=S.rocks.length*40+S.enemies.length*80;S.rocks.length=S.enemies.length=S.enemyBullets.length=0;S.flash=.16;bombSound()}
function hyper(){if(S.mode!=="play")return;const p=S.player;if(p.hyper<35||p.hyperOn>0)return fail();p.hyper-=35;p.hyperOn=1.25;p.inv=1.25;hyperSound()}
function spark(px,py,color=C.white){for(let i=0;i<5;i++)S.particles.push({x:px,y:py,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,g:0,life:.15,max:.15,s:4,c:color})}
function boom(px,py,size,major){const n=major?48:20;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(major?70:40)+Math.random()*(major?145:95);S.particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:8,life:.18+Math.random()*.48,max:.66,s:4+(Math.random()>.72?4:0),c:EXP[Math.floor(Math.random()*EXP.length)]})}explosionSound(major)}
function dist2(x1,y1,x2,y2){const dx=x1-x2,dy=y1-y2;return dx*dx+dy*dy}
function draw(){ctx.save();if(S.shake>0)ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);drawStars();if(S.mode==="menu")drawMenu();if(S.mode==="play")drawPlay();if(S.mode==="gameover")drawGameOver();if(S.mode==="upgrade")drawUpgrade();if(S.mode==="score")drawScore();if(S.mode==="settings")drawSettings();if(S.flash>0){ctx.globalAlpha=Math.min(.45,S.flash*1.8);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}ctx.restore()}

function drawPlay(){pixelText("SCORE",18,16,2,C.gray);pixelText(String(Math.floor(S.score)).padStart(6,"0"),18,37,3,C.white);pixelText("HI SCORE",W/2,16,2,C.gray,"center");pixelText(String(save.hi).padStart(6,"0"),W/2,37,3,C.white,"center");pixelText("SHIELD",W-18,16,2,C.gray,"right");const p=S.player,hpX=W-18-p.maxHp*16;for(let i=0;i<p.maxHp;i++){ctx.strokeStyle=C.gray;ctx.lineWidth=2;ctx.strokeRect(hpX+i*16,39,11,11);if(i<p.hp){ctx.fillStyle=C.white;ctx.fillRect(hpX+3+i*16,42,5,5)}}pixelText("BOMB "+p.bombs,W-18,62,2,C.gray,"right");pixelText("HYPER",W-18,82,2,C.gray,"right");ctx.strokeStyle=C.gray;ctx.lineWidth=2;ctx.strokeRect(W-118,103,100,10);ctx.fillStyle=p.hyperOn>0?"#00d8ff":C.white;ctx.fillRect(W-115,106,94*(p.hyper/100),4);for(const a of S.rocks)drawSprite(a.sprite,a.x,a.y,a.r>20?5:4);for(const e of S.enemies)drawSprite(ENEMY,e.x,e.y,4);for(const b of S.bullets){ctx.fillStyle=C.white;ctx.fillRect((b.x-3)|0,(b.y-9)|0,6,14)}for(const b of S.enemyBullets){ctx.fillStyle=C.gray;ctx.fillRect((b.x-3)|0,b.y|0,6,11)}for(const p0 of S.particles){ctx.globalAlpha=Math.max(0,p0.life/p0.max);ctx.fillStyle=p0.c;ctx.fillRect(p0.x|0,p0.y|0,p0.s,p0.s)}ctx.globalAlpha=1;if(p.inv<=0||Math.floor(p.inv*12)%2===0)drawSprite(SHIP,p.x,p.y,3);pixelText("SECTOR "+S.sector,W/2,486,2,C.gray,"center")}
function drawGameOver(){pixelText("GAME OVER",W/2,70,5,C.white,"center");staticExplosion(W/2,190);pixelText("SCORE",W/2,260,2,C.gray,"center");pixelText(String(Math.floor(S.score)).padStart(6,"0"),W/2,285,4,C.white,"center");pixelText("SECTOR "+S.sector,W/2,340,2,C.gray,"center");pixelText("BEST "+String(save.hi).padStart(6,"0"),W/2,370,2,C.gray,"center");pixelText("FIRE RETRY",W/2,430,3,C.white,"center");pixelText("BOMB MENU",W/2,466,2,C.gray,"center")}
function staticExplosion(cx,cy){for(let i=0;i<36;i++){const a=i/36*Math.PI*2,r=8+(i%7)*5;ctx.fillStyle=EXP[i%EXP.length];ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),8,8)}}
const UPS=[["SHIELD","shield",80],["FIRE RATE","fire",110],["BOMB","bomb",130],["HYPER","hyper",100]];
function drawUpgrade(){pixelText("UPGRADES",W/2,44,4,C.white,"center");pixelText("CREDITS "+String(save.credits).padStart(5,"0"),W/2,84,2,C.gray,"center");const ys=[150,222,294,366];for(let i=0;i<UPS.length;i++){const [name,key,cost0]=UPS[i],lvl=save.up[key];if(i===S.upgrade){ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.strokeRect(34,ys[i]-15,W-68,45)}pixelText(name,52,ys[i],2,i===S.upgrade?C.white:C.gray);for(let j=0;j<5;j++){ctx.strokeStyle=C.gray;ctx.lineWidth=2;ctx.strokeRect(260+j*24,ys[i]-2,15,15);if(j<lvl){ctx.fillStyle=C.white;ctx.fillRect(264+j*24,ys[i]+2,7,7)}}const cost=lvl>=5?"MAX":Math.floor(cost0*(1+lvl*.7));pixelText(String(cost),W-48,ys[i],2,C.gray,"right")}pixelText("LEFT RIGHT CHOOSE",W/2,443,2,C.dim,"center");pixelText("FIRE BUY BOMB BACK",W/2,475,2,C.dim,"center")}
function drawScore(){pixelText("HIGH SCORE",W/2,95,4,C.white,"center");pixelText(String(save.hi).padStart(6,"0"),W/2,180,6,C.white,"center");pixelText("CREDITS "+String(save.credits).padStart(5,"0"),W/2,275,2,C.gray,"center");pixelText("FIRE OR BOMB BACK",W/2,445,2,C.dim,"center")}
function drawSettings(){pixelText("SETTINGS",W/2,95,4,C.white,"center");ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.strokeRect(118,210,276,64);pixelText("SFX",148,231,3,C.white);pixelText(save.sfx?"ON":"OFF",365,231,3,C.white,"right");pixelText("FIRE TOGGLE",W/2,330,2,C.dim,"center");pixelText("BOMB BACK",W/2,366,2,C.dim,"center")}
function selectMenu(){blip(700,.06,.04);if(S.menu===0)resetGame();if(S.menu===1)S.mode="upgrade";if(S.menu===2)S.mode="score";if(S.menu===3)S.mode="settings"}
function firePress(){ensureAudio();if(S.mode==="menu")selectMenu();else if(S.mode==="play")S.firePulse=true;else if(S.mode==="gameover")resetGame();else if(S.mode==="upgrade")buyUpgrade();else if(S.mode==="score"){S.mode="menu";blip(250,.05,.03)}else if(S.mode==="settings"){save.sfx=!save.sfx;store();blip(620,.05,.035)}}
function back(){if(["upgrade","score","settings","gameover"].includes(S.mode)){S.mode="menu";blip(230,.05,.03)}}
function buyUpgrade(){const [name,key,c0]=UPS[S.upgrade],lvl=save.up[key];if(lvl>=5)return fail();const cost=Math.floor(c0*(1+lvl*.7));if(save.credits<cost)return fail();save.credits-=cost;save.up[key]++;store();powerup()}
function navStep(dir){if(S.mode==="menu"){S.menu=(S.menu+dir+4)%4;blip(dir<0?330:410,.04,.025)}else if(S.mode==="upgrade"){S.upgrade=(S.upgrade+dir+UPS.length)%UPS.length;blip(dir<0?330:410,.04,.025)}}
document.querySelectorAll("[data-action]").forEach(btn=>{const action=btn.dataset.action;const down=e=>{e.preventDefault();ensureAudio();try{btn.setPointerCapture(e.pointerId)}catch{}btn.classList.add("pressed");if(action==="left"){S.pressed.left=true;navStep(-1)}if(action==="right"){S.pressed.right=true;navStep(1)}if(action==="fire"){S.pressed.fire=true;firePress()}if(action==="bomb")bomb();if(action==="hyper"){S.pressed.hyper=true;hyper()}};const up=e=>{e.preventDefault();btn.classList.remove("pressed");if(action==="left")S.pressed.left=false;if(action==="right")S.pressed.right=false;if(action==="fire")S.pressed.fire=false;if(action==="hyper")S.pressed.hyper=false};btn.addEventListener("pointerdown",down,{passive:false});btn.addEventListener("pointerup",up,{passive:false});btn.addEventListener("pointercancel",up,{passive:false})});
addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","Space","Enter"].includes(e.code))e.preventDefault();if(e.code==="ArrowLeft"||e.code==="KeyA"){if(!S.pressed.left)navStep(-1);S.pressed.left=true}if(e.code==="ArrowRight"||e.code==="KeyD"){if(!S.pressed.right)navStep(1);S.pressed.right=true}if(e.code==="Space"||e.code==="Enter"){if(!S.pressed.fire)firePress();S.pressed.fire=true}if(e.code==="KeyB")bomb();if(e.code==="KeyH"||e.code==="ShiftLeft"||e.code==="ShiftRight")hyper();if(e.code==="Escape")back()});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")S.pressed.left=false;if(e.code==="ArrowRight"||e.code==="KeyD")S.pressed.right=false;if(e.code==="Space"||e.code==="Enter")S.pressed.fire=false});
let audio=null,master=null;function ensureAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination)}function tone(freq,dur=.06,vol=.04,type="square",end=null){if(!save.sfx)return;ensureAudio();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(35,end),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(master);o.start();o.stop(audio.currentTime+dur)}function noise(dur=.12,vol=.05){if(!save.sfx)return;ensureAudio();const len=Math.floor(audio.sampleRate*dur),buf=audio.createBuffer(1,len,audio.sampleRate),a=buf.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const src=audio.createBufferSource(),g=audio.createGain();src.buffer=buf;g.gain.value=vol;src.connect(g).connect(master);src.start()}function blip(f,d,v){tone(f,d,v,"square",f*.8)}function laserSound(){tone(920,.04,.018,"square",360)}function enemySound(){tone(220,.05,.015,"square",330)}function hitSound(){noise(.11,.05);tone(120,.13,.035,"square",60)}function explosionSound(m){noise(m?.35:.16,m?.085:.05);tone(m?85:125,m?.3:.13,m?.05:.03,"square",50)}function bombSound(){noise(.3,.08);tone(75,.35,.05,"sawtooth",40)}function hyperSound(){tone(220,.12,.035,"square",850)}function powerup(){tone(420,.08,.04,"square",680);setTimeout(()=>tone(700,.09,.035,"square",940),70)}function fail(){tone(120,.11,.03,"square",60)}function startSound(){tone(220,.07,.03);setTimeout(()=>tone(440,.08,.035),75);setTimeout(()=>tone(880,.09,.03),145)}function overSound(){tone(220,.11,.04,"square",140);setTimeout(()=>tone(115,.22,.045,"square",60),110)}
function loop(t){const dt=Math.min(.033,(t-S.last)/1000||0);S.last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
